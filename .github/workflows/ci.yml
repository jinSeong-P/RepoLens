name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Check types, tests, and extension build
        run: npm run check

      - name: Package extension archive
        run: |
          node scripts/package-extension.mjs build/extension
          cd dist
          sha256sum repolens-extension-*.zip > SHA256SUMS

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: repolens-extension-${{ github.sha }}
          path: |
            dist/repolens-extension-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
